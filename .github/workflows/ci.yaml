# Build and test every Lake package on every push and pull request, run the demo and the
# classifier once, and check the runnable examples against their recorded outputs.
# The contract this workflow keeps is checked by scripts/check_release.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: leanrdf (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
      - name: Release contract
        run: python3 scripts/check_release.py

  sparql:
    name: leanrdf-sparql (algebra and evaluator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: sparql
          build: true
          test: true
      - name: Examples (SPARQL)
        run: scripts/examples.sh sparql

  owl:
    name: leanrdf-owl (OWL 2 RL rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: owl
          build: true
          test: true

  shacl:
    name: leanrdf-shacl (validator and W3C suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: shacl
          build: true
          test: true
      - name: Examples (SHACL)
        run: scripts/examples.sh shacl

  elpi:
    name: leanrdf-elpi (bridge and demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: elpi
          build: true
          test: true
      - name: Demo on the example ontology
        working-directory: elpi
        run: lake exe leanrdf-demo examples/pets.nt examples/query-mammal-owner.nt
      - name: Classify the EL example
        working-directory: elpi
        run: lake exe leanrdf-classify examples/el-ontology.ttl
      - name: Examples (demo, oxilite, classifier)
        run: scripts/examples.sh elpi

  statements:
    name: leanrdf-statements (statement graphs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: statements
          build: true
          test: true
      - name: Examples (statement graphs)
        run: scripts/examples.sh statements
