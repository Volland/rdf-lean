<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">A simple interpretation</title>
  <desc id="d">On the left, the graph ex:bob ex:hasPet _:p. On the right, a world with elements Bob, Tom and the property hasPet. IS maps IRIs to elements, a blank-node mapping A sends _:p to Tom, and the pair Bob, Tom is in IEXT of hasPet, so the triple is true.</desc>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a6b00"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#23307a"/></marker>
  </defs>
  <rect width="860" height="330" rx="14" fill="#fbfbf8"/>
  <text x="150" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#23307a">syntax: a graph g</text>
  <text x="660" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#11735f">meaning: an interpretation I</text>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="70" width="110" height="38" rx="19" fill="#fff" stroke="#23307a" stroke-width="1.5"/>
    <text x="95" y="94" fill="#1c1d20">ex:bob</text>
    <rect x="40" y="230" width="110" height="38" rx="19" fill="#fff" stroke="#23307a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="95" y="254" fill="#1c1d20">_:p</text>
    <line x1="95" y1="108" x2="95" y2="226" stroke="#23307a" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="104" y="166" fill="#23307a" font-size="13" text-anchor="start">ex:hasPet</text>
  </g>
  <ellipse cx="660" cy="180" rx="170" ry="120" fill="#e7f6f2" stroke="#3fb39d"/>
  <text x="660" y="85" text-anchor="middle" font-size="13" fill="#11735f">Dom (IR, IP ⊆ Dom)</text>
  <g font-size="14">
    <circle cx="590" cy="130" r="9" fill="#23307a"/><text x="606" y="135" fill="#1c1d20">Bob</text>
    <circle cx="590" cy="250" r="9" fill="#23307a"/><text x="606" y="255" fill="#1c1d20">Tom</text>
    <circle cx="730" cy="190" r="9" fill="#159c86"/><text x="746" y="195" fill="#1c1d20">hasPet</text>
  </g>
  <text x="660" y="318" text-anchor="middle" font-size="13" fill="#11735f">IEXT(hasPet) ∋ ⟨Bob, Tom⟩, so I ⊨ g</text>
  <g fill="none" stroke="#9a6b00" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#m)">
    <path d="M150 89 C 330 60, 450 100, 578 128"/>
    <path d="M150 249 C 330 290, 450 270, 578 252"/>
    <path d="M184 162 C 360 165, 530 190, 718 190"/>
  </g>
  <g font-size="12" fill="#9a6b00" font-weight="600">
    <text x="330" y="70">IS</text>
    <text x="330" y="295">A (blank-node mapping)</text>
    <text x="400" y="170">IS</text>
  </g>
</svg>
